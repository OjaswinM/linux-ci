name: powerpc/kernel+qemu+kselftest+minimal

# Controls when the action will run.
on:
  # This allows the build to be triggered manually via the github UI.
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # ppc64le_guest_defconfig
          - subarch: ppc64le
            defconfig: ppc64le_guest_defconfig
            image: fedora-42
            # We should prepend /linux because thats where it lives in the build container
            merge_config: "/linux/arch/powerpc/configs/kvm_guest.config"

    env:
      ARCH: powerpc
      TARGET: kernel
      CCACHE: 1
      SUBARCH: ${{ matrix.subarch }}
      IMAGE: ${{ matrix.image }}
      DEFCONFIG: ${{ matrix.defconfig }}
      MERGE_CONFIG: ${{ matrix.merge_config }}

    steps:
    - uses: actions/checkout@v4

    - name: Register problem matchers
      run: |
        echo "::add-matcher::.github/problem-matchers/compiler-source.json"
        echo "::add-matcher::.github/problem-matchers/compiler-non-source.json"
    - name: Load ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ matrix.image }}-${{ matrix.subarch }}-${{ matrix.defconfig }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build
      run: |
        mkdir -p ~/.ccache
        ./arch/powerpc/tools/ci-build.sh
    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.defconfig }}-${{ matrix.image }}
        path: |
          ~/output/vmlinux
          ~/output/.config
          ~/output/System.map
          ~/output/modules.tar.bz2
          ~/output/arch/powerpc/boot/zImage
          ~/output/arch/powerpc/boot/uImage
          ~/output/include/config/kernel.release
  boot:
    runs-on: ubuntu-latest
    needs: kernel

    strategy:
      matrix:
        include:
          - defconfig: ppc64le_guest_defconfig
            machine: pseries+p9+tcg
            machine_2: pseries+p9+tcg
            packages: qemu-system-ppc64
            rootfs: ubuntu22.04-cloudimg-ppc64el.qcow2
            new-image: fedora-42

    steps:
    - uses: actions/checkout@v4
      with:
        repository: ojaswinm/ci-scripts
        ref: kselftest-support

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download and verify root disk
      run: |
        ./root-disks/install-deps.sh
        make -C root-disks cloud-init-user-data.img
        make -C root-disks ${{ matrix.rootfs }}

    - name: APT update
      run: sudo apt update

    - name: Install dependencies
      run: sudo apt install -y ${{ matrix.packages }} python3-pexpect python3-termcolor python3-yaml

    - uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.defconfig }}-${{ matrix.new-image }}

    - name: Run kselftests on ${{ matrix.machine }} with ${{ matrix.new-image }} build kernel
      run: ./scripts/boot/qemu-${{ matrix.machine }} --cloud-image ${{ matrix.rootfs }} --pexpect-timeout 0 --test-name kselftests --test-args kernel_src=${{ github.workspace }},target=powerpc
